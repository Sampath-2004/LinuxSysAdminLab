<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#007f86"/></marker></defs><rect width="1000" height="570" fill="#f3f6fa"/><g font-family="Arial,sans-serif" fill="#17324d"><text x="40" y="48" font-size="26" font-weight="bold">LinuxSysAdminLab</text><text x="40" y="78" font-size="16">VirtualBox NAT Network: LinuxLab | 10.20.20.0/24 | gateway 10.20.20.1</text><rect x="40" y="115" width="920" height="150" rx="12" fill="white" stroke="#cbd5e1"/><text x="65" y="150" font-size="22" font-weight="bold">Windows host</text><text x="65" y="181" font-size="17">SSH 127.0.0.1:2222 → LNX01:22 | HTTP :8080 → LNX01:80</text><text x="65" y="210" font-size="17">Browser tunnels: :9090 → Prometheus | :3000 → Grafana (over SSH)</text><text x="65" y="239" font-size="15">Host endpoints bind to loopback; SSH forwarding windows must stay open.</text><rect x="40" y="335" width="375" height="165" rx="12" fill="white" stroke="#cbd5e1"/><text x="65" y="372" font-size="22" font-weight="bold">MGMT01 | 10.20.20.4</text><text x="65" y="404" font-size="17">Ansible control node</text><text x="65" y="433" font-size="17">Dedicated SSH key, inventory, playbook</text><text x="65" y="466" font-size="15">Current DHCP address</text><rect x="585" y="335" width="375" height="165" rx="12" fill="white" stroke="#cbd5e1"/><text x="610" y="372" font-size="22" font-weight="bold">LNX01 | 10.20.20.3</text><text x="610" y="404" font-size="17">Nginx, UFW, users/groups, backups</text><text x="610" y="433" font-size="17">Node Exporter → Prometheus → Grafana</text><text x="610" y="466" font-size="15">Current DHCP address</text><path d="M415 419 H580" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/><text x="445" y="398" font-size="16">SSH :22</text><path d="M775 265 V329" stroke="#007f86" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="544" font-size="15">Backups on guest + a verified Windows copy remain on the same physical laptop.</text></g></svg>